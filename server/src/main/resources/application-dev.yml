app:
  frontend-url: ${CLIENT_PROTOCOL:http}://${CLIENT_PUBLIC_HOST:localhost}:${CLIENT_PORT:5173}
  backend-url: ${SERVER_PROTOCOL:http}://${SERVER_PUBLIC_HOST:localhost}:${SERVER_PORT:8080}

server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/analytics.readonly
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  devtools:
    restart:
      enabled: true
      additional-paths: /app/src/main

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

ai:
  provider: ollama
  base-url: http://${AI_HOST:localhost}:${AI_PORT:11434}
  model: ${AI_MODEL:llama3.2:1b}
  timeout-seconds: 180

session:
  duration-hours: ${SESSION_DURATION_HOURS:720}
  cookie-name: ${SESSION_COOKIE_NAME:SESSION_TOKEN}
  cookie-secure: ${SESSION_COOKIE_SECURE:false}
  cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
